# ═══════════════════════════════════════════════════════════════════════════════
# Grafana Dashboard Auto-Provisioning for SETTLE
# ═══════════════════════════════════════════════════════════════════════════════

apiVersion: 1

providers:
  - name: "SETTLE Dashboards"
    orgId: 1
    folder: "SETTLE"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
